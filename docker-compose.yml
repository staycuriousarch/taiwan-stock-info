# 一鍵啟動：docker compose up --build
# 前端 → http://localhost:8080 ，後端 API/docs → http://localhost:8000/docs
services:
  backend:
    build: ./backend
    container_name: finance-backend
    volumes:
      - backend-data:/app/data          # DuckDB 快取持久化
      - ./backend/.env:/app/.env:ro     # 掛 FinMind token（pydantic 直接讀，不烤進 image）
    ports:
      - "8000:8000"                     # 對外開放 API/docs（前端其實走內網即可）
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finance-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"                       # 瀏覽器開這個
    restart: unless-stopped

volumes:
  backend-data:
